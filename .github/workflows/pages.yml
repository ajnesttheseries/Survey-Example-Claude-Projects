name: Deploy gallery to GitHub Pages

on:
  push:
    branches: [claude/facebook-post-comments-extraction-70y3hq]
    # ไฟล์ที่ไม่กระทบหน้าเว็บ ไม่ต้อง deploy ใหม่
    paths-ignore:
      - 'README.md'
      - 'tools/README.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# ปล่อยให้ deploy ที่ค้างอยู่ทำงานจนจบ ไม่ยกเลิกกลางคัน
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # สร้างเว็บใหม่จาก data/catalog.json ทุกครั้ง
      # เว็บที่ deploy จึงตรงกับข้อมูลในรีโปเสมอ ไม่ต้องพึ่งไฟล์ที่ commit ไว้
      - name: สร้างไฟล์เว็บจากข้อมูลในรีโป
        run: python tools/make_gallery.py

      - name: ตรวจว่าไฟล์ที่สร้างครบและถูกต้อง
        run: |
          test -f site/index.html || { echo "ไม่พบ site/index.html"; exit 1; }
          test -f site/thai-ai-showcase.xlsx || { echo "ไม่พบไฟล์ Excel"; exit 1; }
          head -1 site/index.html | grep -qi '<!doctype html>' \
            || { echo "site/index.html ไม่ใช่เอกสาร HTML เต็มใบ"; exit 1; }
          grep -c 'article' site/index.html > /dev/null
          echo "ขนาดไฟล์: $(du -h site/index.html | cut -f1)"

      # GITHUB_TOKEN ไม่มีสิทธิ์ระดับ admin จึงเปิด Pages ให้เองไม่ได้
      # ถ้ายังไม่ได้เปิด ให้ตายตรงนี้พร้อมบอกวิธีแก้ แทนที่จะไปตายแบบงง ๆ ตอน deploy
      - name: ตรวจว่าเปิด GitHub Pages ไว้หรือยัง
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$code" = "404" ]; then
            {
              echo "### ยังไม่ได้เปิด GitHub Pages"
              echo ""
              echo "เปิดครั้งเดียวที่ **Settings → Pages → Build and deployment → Source**"
              echo "แล้วเลือก **GitHub Actions** จากนั้นสั่ง Re-run workflow นี้"
              echo ""
              echo "https://github.com/${{ github.repository }}/settings/pages"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::ยังไม่ได้เปิด GitHub Pages — ไปที่ Settings → Pages แล้วตั้ง Source เป็น GitHub Actions จากนั้น re-run"
            exit 1
          fi
          echo "Pages เปิดอยู่แล้ว (HTTP $code)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
